{{- if (index .Values "esm-sh" "enabled") }}
apiVersion: v1
kind: Service
metadata:
  name: esm-sh
  namespace: {{ include "tentacular-platform.namespace.support" . }}
  labels:
    {{- include "tentacular-platform.esm-sh.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tentacular-platform.esm-sh.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
