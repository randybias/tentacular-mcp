{{/*
Exoskeleton Secret: wires backing-service connection details to the MCP server.
Contains PostgreSQL and NATS credentials derived from subchart configuration.
*/}}
{{- if and (index .Values "tentacular-mcp" "enabled") .Values.exoskeleton.enabled (not .Values.exoskeleton.existingSecret) }}
{{- $pgEnabled := .Values.postgresql.enabled -}}
{{- $natsEnabled := .Values.nats.enabled -}}
{{- if or $pgEnabled $natsEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: tentacular-exoskeleton-config
  namespace: {{ include "tentacular-platform.namespace.system" . }}
  labels:
    {{- include "tentacular-platform.labels" . | nindent 4 }}
    tentacular.io/exoskeleton-config: "true"
type: Opaque
stringData:
  {{- if $pgEnabled }}
  postgres-host: {{ printf "%s-postgresql.%s.svc.cluster.local" .Release.Name (include "tentacular-platform.namespace.exoskeleton" .) }}
  postgres-port: "5432"
  postgres-database: {{ .Values.postgresql.auth.database | quote }}
  postgres-user: {{ .Values.postgresql.auth.username | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  postgres-sslmode: {{ .Values.exoskeleton.postgresSSLMode | quote }}
  {{- end }}
  {{- if $natsEnabled }}
  nats-url: {{ printf "nats://%s-nats.%s.svc.cluster.local:4222" .Release.Name (include "tentacular-platform.namespace.exoskeleton" .) }}
  nats-token: {{ .Values.nats.config.merge.authorization.token | quote }}
  {{- end }}
{{- end }}
{{- end }}
