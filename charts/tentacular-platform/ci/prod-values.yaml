# Production profile - cloud-agnostic, works with any K8s cluster
#
# MANDATORY --set parameters (secrets are NOT stored in this file):
#
#   --set global.domain=<your-domain>                          # e.g. tentacular.example.com
#   --set tls.clusterIssuers.email=admin@<your-domain>         # Let's Encrypt registration email
#   --set postgresql.auth.password=<secret>                    # PostgreSQL app user password
#   --set nats.config.merge.authorization.token=<secret>       # NATS auth token
#   --set tentacular-mcp.auth.token=<secret>                   # MCP bearer token
#   --set keycloak.admin.password=<secret>                     # Keycloak admin console password
#   --set keycloakx.database.password=<secret>                 # Keycloak PostgreSQL user password
#   --set exoskeletonAuth.clientSecret=<secret>                # OIDC client secret (from Keycloak)
#   --set rustfs.secret.accessKey=<secret>                     # RustFS admin access key
#   --set rustfs.secret.secretKey=<secret>                     # RustFS admin secret key
#
# Example install (generates secrets on the fly):
#   helm install tentacular charts/tentacular-platform/ \
#     -f charts/tentacular-platform/ci/prod-values.yaml \
#     -n tentacular-system --create-namespace \
#     --set global.domain=tentacular.example.com \
#     --set tls.clusterIssuers.email=admin@tentacular.example.com \
#     --set postgresql.auth.password="$(openssl rand -hex 16)" \
#     --set nats.config.merge.authorization.token="$(openssl rand -hex 16)" \
#     --set tentacular-mcp.auth.token="$(openssl rand -hex 32)" \
#     --set keycloak.admin.password="$(openssl rand -hex 16)" \
#     --set keycloakx.database.password="$(openssl rand -hex 16)" \
#     --set exoskeletonAuth.clientSecret="$(openssl rand -hex 32)" \
#     --set rustfs.secret.accessKey="$(openssl rand -hex 16)" \
#     --set rustfs.secret.secretKey="$(openssl rand -hex 32)"
#
# WARNING: Do NOT use --reuse-values together with -f on upgrades — the values
# files will override any --set secrets from the previous install, breaking auth.
# Instead, pass all mandatory --set parameters explicitly on every upgrade.
#
# In production, use external secret management (e.g., Sealed Secrets,
# External Secrets Operator) instead of plaintext values in this file.
#
# Prerequisites:
#   1. nginx ingress controller installed
#   2. cert-manager installed (for TLS via Let's Encrypt)
#   3. Default StorageClass available
#   4. DNS records pointing to the ingress controller:
#      - tentacular-mcp.<domain>
#      - tentacular-keycloak.<domain>
global:
  domain: tentacular.example.com
  # Allow non-Bitnami images for init containers (Bitnami images are
  # behind Broadcom paywall since Aug 2025).
  security:
    allowInsecureImages: true

namespaces:
  system:
    create: true
  exoskeleton:
    create: true
  support:
    create: true

networkPolicies:
  enabled: true

postgresql:
  enabled: true
  image:
    # Bitnami removed versioned tags; use latest until chart is updated
    tag: latest
  auth:
    username: tentacular_admin
    database: tentacular
    # password must be set at deploy time: --set postgresql.auth.password=<secret>
  tls:
    # TLS for PostgreSQL connections using cert-manager self-signed certificates.
    # cert-manager creates the Secret; Bitnami PostgreSQL mounts it.
    # NOTE: Do not use autoGenerated=true — the Bitnami init image
    # (bitnami/os-shell) is behind Broadcom's paywall since Aug 2025.
    enabled: true
    autoGenerated: false
    certificatesSecret: tentacular-postgresql-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    # certCAFilename omitted — do not require client certificates.
    # Server-side TLS encrypts the connection; clients authenticate via password.
  # Override Bitnami init container image (os-shell is behind Broadcom paywall)
  volumePermissions:
    image:
      registry: docker.io
      repository: alpine
      tag: "3.21"
  primary:
    persistence:
      size: 20Gi
      # storageClass omitted → uses cluster default

nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        dir: /data
        pvc:
          enabled: true
          size: 5Gi
          # storageClassName omitted → uses cluster default
    merge:
      max_payload: 8388608
      # authorization.token must be set at deploy time:
      # --set nats.config.merge.authorization.token=<secret>

# cert-manager: assumes pre-installed in production clusters.
cert-manager:
  enabled: false

tls:
  clusterIssuers:
    create: true
    # CHANGE: Set your email for Let's Encrypt registration
    email: admin@example.com
    production: true
  certificates:
    mcp:
      create: true
      secretName: tentacular-mcp-tls
    auth:
      create: false

tentacular-mcp:
  enabled: true
  namespace:
    create: false
  # auth.token must be set at deploy time: --set tentacular-mcp.auth.token=<secret>
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  exoskeletonSecretName: tentacular-exoskeleton-config
  extraEnvFrom:
    - configMapRef:
        name: tentacular-proxy-config
        optional: true

exoskeleton:
  enabled: true
  postgresSSLMode: "require"

# Keycloak OIDC authentication for deployer identity.
# issuerURL is auto-derived from the bundled Keycloak when keycloak.enabled=true.
exoskeletonAuth:
  enabled: true
  clientID: "tentacular-mcp"
  # clientSecret must be set at deploy time: --set exoskeletonAuth.clientSecret=<secret>

# Keycloak deployment (codecentric/keycloakx subchart)
keycloak:
  enabled: true
  realm: tentacular
  admin:
    user: admin
    # password must be set at deploy time: --set keycloak.admin.password=<secret>
  # hostname auto-derived from global.domain: tentacular-keycloak.<domain>
  hostname: ""
  ingress:
    enabled: true

keycloakx:
  replicas: 1
  database:
    vendor: postgres
    database: keycloak
    username: keycloak
    # password must be set at deploy time: --set keycloakx.database.password=<secret>

# -- RustFS S3-compatible object storage
rustfs:
  enabled: true
  storageclass:
    name: ""
    dataStorageSize: 10Gi
    logStorageSize: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # secret.accessKey and secret.secretKey must be set at deploy time:
  # --set rustfs.secret.accessKey=<secret> --set rustfs.secret.secretKey=<secret>

esm-sh:
  enabled: true
  replicas: 2
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  mode: ingress
  className: nginx
  controllerNamespace: ingress-nginx
  mcp:
    # hostname auto-derived from global.domain: tentacular-mcp.<domain>
    hostname: ""
  tls:
    enabled: true
    secretName: tentacular-mcp-tls
  # nginx session affinity: routes requests with the same Mcp-Session-Id
  # header to the same MCP pod. Required for multi-replica MCP deployments
  # using MCP Streamable HTTP transport.
  annotations:
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_mcp_session_id"
