{{- if not .Values.secret.existingSecret }}
{{- if not .Values.secret.rustfs.access_key }}
  {{- fail "secret.rustfs.access_key is required when secret.existingSecret is not set. Provide RustFS admin credentials via --set secret.rustfs.access_key=<value>." }}
{{- end }}
{{- if not .Values.secret.rustfs.secret_key }}
  {{- fail "secret.rustfs.secret_key is required when secret.existingSecret is not set. Provide RustFS admin credentials via --set secret.rustfs.secret_key=<value>." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.secretName" . }}
  namespace: {{ include "rustfs.namespace" . }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
type: Opaque
data:
  RUSTFS_ACCESS_KEY: {{ .Values.secret.rustfs.access_key | b64enc | quote }}
  RUSTFS_SECRET_KEY: {{ .Values.secret.rustfs.secret_key | b64enc | quote }}
{{- end }}

{{- if .Values.imageRegistryCredentials.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.imagePullSecret.name" . }}
  namespace: {{ include "rustfs.namespace" . }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
