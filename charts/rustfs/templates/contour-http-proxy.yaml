{{- if eq .Values.ingress.className "contour" }}
{{- $fullname := include "rustfs.fullname" . }}
{{- range $i, $host := .Values.ingress.hosts }}
{{- if $i }}
---
{{- end }}
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ $fullname }}-proxy{{ if $i }}-{{ $i }}{{ end }}
  labels:
    {{- include "rustfs.labels" $ | nindent 4 }}
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  namespace: {{ include "rustfs.namespace" $ }}
spec:
  virtualhost:
    fqdn: {{ $host.host | quote }}
    {{- if $.Values.ingress.tls.enabled }}
    tls:
      secretName: {{ $fullname }}-tls
    {{- end }}
  routes:
    - conditions:
        {{- range $host.paths }}
        - prefix: {{ .path }}
        {{- end }}
      services:
        - name: {{ $fullname }}-svc
          port: {{ $.Values.service.console.port }}
      loadBalancerPolicy:
        strategy: Cookie
      timeoutPolicy:
        response: infinity
        idle: 5m
      {{- if $.Values.ingress.tls.enabled }}
      permitInsecure: true
      {{- end }}
{{- end }}
{{- end }}
