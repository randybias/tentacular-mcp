{{- if and .Values.mtls.enabled (eq .Values.ingress.className "traefik")}}
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ include "rustfs.fullname" . }}-transport
  namespace: {{ include "rustfs.namespace" . }}
spec:
  rootcas:
    - {{ include "rustfs.fullname" . }}-root-ca-secret
  certificatesSecrets:
    - {{ include "rustfs.fullname" . }}-client-tls
  insecureSkipVerify: false
  serverName: {{ (index .Values.ingress.hosts 0).host | quote }}
{{- end }}
