{{- if .Values.networkPolicy.create }}
{{- /*
Allow OTLP ingress from tentacle/enclave namespaces and the system namespace
on ports 4317 (gRPC) and 4318 (HTTP).

NOTE: We use explicit namespace selectors instead of namespaceSelector: {}
(match-all) because kube-router silently drops match-all rules, which blocks
all telemetry ingress. This matches the pattern used in tentacular-support's
esm-sh NetworkPolicy.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tentacular-observability.fullname" . }}-otlp-ingress
  namespace: {{ include "tentacular-observability.namespace" . }}
  labels:
    {{- include "tentacular-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tentacular-observability.name" . }}-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Rule 1: Allow OTLP from all Tentacular-managed namespaces (enclaves).
    # kube-router requires explicit selectors; namespaceSelector: {} is silently dropped.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: tentacular
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Rule 2: Allow OTLP from the system namespace (MCP server, platform components).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tentacular-system
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
{{- end }}
---
{{/*
Allow Traefik ingress controller to reach the oauth2-proxy pod (forwardAuth).
*/}}
{{- if and .Values.networkPolicy.create .Values.oauth2Proxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tentacular-observability.fullname" . }}-oauth2-proxy-ingress
  namespace: {{ include "tentacular-observability.namespace" . }}
  labels:
    {{- include "tentacular-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 4180
{{- end }}
---
{{/*
Allow traffic to reach the SigNoz frontend pod.
Sources: Traefik (direct, when oauth2-proxy disabled) and oauth2-proxy
(reverse-proxy upstream, when oauth2-proxy enabled).
*/}}
{{- if and .Values.networkPolicy.create .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tentacular-observability.fullname" . }}-signoz-ingress
  namespace: {{ include "tentacular-observability.namespace" . }}
  labels:
    {{- include "tentacular-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: signoz
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: signoz
      app.kubernetes.io/component: signoz
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.oauth2Proxy.enabled }}
    # oauth2-proxy reverse-proxies authenticated requests to SigNoz
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
    {{- else }}
    # Direct ingress from Traefik when no auth proxy is in use
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- end }}
---
{{/*
Allow oauth2-proxy egress to Keycloak (HTTPS) and DNS.
*/}}
{{- if and .Values.networkPolicy.create .Values.oauth2Proxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tentacular-observability.fullname" . }}-oauth2-proxy-egress
  namespace: {{ include "tentacular-observability.namespace" . }}
  labels:
    {{- include "tentacular-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Keycloak OIDC endpoints (HTTPS, via Traefik ingress or in-cluster)
    - ports:
        - protocol: TCP
          port: 443
    # Keycloak in-cluster (port 8080 in tentacular-exoskeleton)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tentacular-exoskeleton
      ports:
        - protocol: TCP
          port: 8080
    # SigNoz upstream (reverse-proxy mode, same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: signoz
              app.kubernetes.io/component: signoz
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
