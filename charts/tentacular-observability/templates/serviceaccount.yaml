{{- if and .Values.observability.collector.create .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tentacular-observability.serviceAccountName" . }}
  namespace: {{ include "tentacular-observability.namespace" . }}
  labels:
    {{- include "tentacular-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
