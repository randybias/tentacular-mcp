{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tentacular-mcp.authSecretName" . }}
  namespace: {{ include "tentacular-mcp.namespace" . }}
  labels:
    {{- include "tentacular-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $secretName := include "tentacular-mcp.authSecretName" . }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and (not .Values.auth.token) $existingSecret (index $existingSecret.data "token") }}
  token: {{ index $existingSecret.data "token" }}
  {{- else }}
  token: {{ (.Values.auth.token | default (randAlphaNum 64)) | b64enc }}
  {{- end }}
{{- end }}
